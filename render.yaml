# Free testing deployment. Data is ephemeral on this plan.
# For durable games, choose a paid service, attach a disk at /var/data,
# and change DATA_DIR to /var/data in your dashboard.
services:
  - type: web
    name: drafters-vs-workload-demons
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
